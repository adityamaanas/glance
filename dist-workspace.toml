[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Custom message to display on successful install
install-success-msg = "Glance is installed. Optional Claude hooks: glance-panel setup. Cursor IDE hooks: glance-panel setup --harness cursor."
# Checksums to generate for each App
checksum = "sha256"
# Which actions to run on pull requests
pr-run-mode = "upload"
# Whether to enable GitHub Attestations
github-attestations = false
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
include = ["docs"]
global-artifacts-jobs = ["./release-smoke"]

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-15-intel"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-pc-windows-msvc = "windows-2022"
