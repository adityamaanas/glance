name: Bug report
description: Report behavior that did not work as expected.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Remove tokens and private conversation content. For vulnerabilities, follow SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Glance version or commit, Claude Code version, herdr version, and terminal.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command and a minimal example using fictional data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized error text or a screenshot if useful.
    validations:
      required: true
