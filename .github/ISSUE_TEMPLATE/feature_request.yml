name: Feature request
description: Propose an improvement to session orientation.
title: "idea: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a concrete session or workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the user see or do? Include alternatives if useful.
    validations:
      required: true
