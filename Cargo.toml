[package]
name = "glance-panel"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "glance: a live orientation panel for one Claude Code session, rendered in a herdr split pane."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/adityamaanas/glance"
keywords = ["claude-code", "herdr", "tui", "terminal", "ai"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "glance-panel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
shell-words = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
