[package]
name = "glance-panel"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "A live orientation panel for coding-agent sessions, with plans, evidence, graphs and personal todos."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/adityamaanas/glance"
homepage = "https://github.com/adityamaanas/glance"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md", "docs/**", "assets/**"]
keywords = ["claude-code", "herdr", "tui", "terminal", "ai"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "glance-panel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
shell-words = "1"
tempfile = "3"
interprocess = "2.4"
open = "5"
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
