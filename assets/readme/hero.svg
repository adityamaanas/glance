<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">glance — Pick up where you left off.</title>
  <desc id="desc">A dark teal banner with the Glance split-pane mark and a compact illustration of a session orientation panel.</desc>
